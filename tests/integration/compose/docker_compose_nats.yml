services:
  nats1:
    image: nats
    ports:
      - "${NATS_EXTERNAL_PORT:-4444}:${NATS_INTERNAL_PORT:-4444}"
    command: ["-c", "/etc/certs/nats-server.conf"]
    volumes:
      - type: bind
        source: "${NATS_CERT_DIR:-}/nats"
        target: /etc/certs
    stop_grace_period: 5s
    cpus: 3
